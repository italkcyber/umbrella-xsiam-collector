<svg xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="With a self-managed bucket, Umbrella writes to your bucket which notifies an SQS queue that the native XSIAM S3 collector consumes. With a Cisco-managed bucket, no notification can be configured because Cisco owns the bucket, so the collector must poll it instead."><rect width="900" height="200" fill="#0D151A"/>
          <defs>
            <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#E6EEF2"/>
            </marker>
          </defs>

          <text x="10" y="20" font-size="11" font-weight="600" letter-spacing="1.2" fill="#E6EEF2" opacity=".55">SELF-MANAGED BUCKET — the standard route</text>
          <rect x="10" y="32" width="150" height="42" rx="4" fill="none" stroke="#E6EEF2" stroke-width="1.5"/>
          <text x="85" y="58" font-size="12" text-anchor="middle" fill="#E6EEF2">your S3 bucket</text>
          <line x1="160" y1="53" x2="238" y2="53" stroke="#E6EEF2" stroke-width="1.5" marker-end="url(#ar2)"/>
          <text x="199" y="46" font-size="11" text-anchor="middle" fill="#E6EEF2" opacity=".8">notifies</text>
          <rect x="244" y="32" width="120" height="42" rx="4" fill="none" stroke="#E6EEF2" stroke-width="1.5"/>
          <text x="304" y="58" font-size="12" text-anchor="middle" fill="#E6EEF2">SQS queue</text>
          <line x1="364" y1="53" x2="442" y2="53" stroke="#E6EEF2" stroke-width="1.5" marker-end="url(#ar2)"/>
          <text x="403" y="46" font-size="11" text-anchor="middle" fill="#E6EEF2" opacity=".8">consumes</text>
          <rect x="448" y="32" width="200" height="42" rx="4" fill="none" stroke="#E6EEF2" stroke-width="1.5"/>
          <text x="548" y="58" font-size="12" text-anchor="middle" fill="#E6EEF2">native S3 data source</text>

          <line x1="10" y1="95" x2="890" y2="95" stroke="#E6EEF2" stroke-width="1" opacity=".25"/>

          <text x="10" y="118" font-size="11" font-weight="600" letter-spacing="1.2" fill="#E6EEF2" opacity=".55">CISCO-MANAGED BUCKET — this build</text>
          <rect x="10" y="130" width="150" height="34" rx="4" fill="none" stroke="#E6EEF2" stroke-width="1.5"/>
          <text x="85" y="152" font-size="12" text-anchor="middle" fill="#E6EEF2">Cisco's bucket</text>
          <g opacity=".45">
            <line x1="160" y1="147" x2="238" y2="147" stroke="#E6EEF2" stroke-width="1.5" stroke-dasharray="4 3"/>
            <line x1="188" y1="137" x2="210" y2="157" stroke="#E6EEF2" stroke-width="1.5"/>
            <line x1="210" y1="137" x2="188" y2="157" stroke="#E6EEF2" stroke-width="1.5"/>
            <rect x="244" y="130" width="120" height="34" rx="4" fill="none" stroke="#E6EEF2" stroke-width="1.5" stroke-dasharray="4 3"/>
            <text x="304" y="152" font-size="12" text-anchor="middle" fill="#E6EEF2">no SQS possible</text>
          </g>
          <g>
            <path d="M 85 164 L 85 172 L 548 172 L 548 164" fill="none" stroke="#56C4BF" stroke-width="2" marker-end="url(#ar2)"/>
            <text x="316" y="186" font-size="11" text-anchor="middle" fill="#56C4BF" font-weight="600">the collector polls the bucket directly</text>
          </g>
          <rect x="448" y="130" width="200" height="34" rx="4" fill="none" stroke="#E6EEF2" stroke-width="1.5"/>
          <text x="548" y="145" font-size="11" text-anchor="middle" fill="#E6EEF2">Cisco Umbrella S3</text>
          <text x="548" y="159" font-size="11" text-anchor="middle" fill="#E6EEF2">Event Collector</text>
        </svg>
